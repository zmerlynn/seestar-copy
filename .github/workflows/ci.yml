name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  go-support:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Go support check
        run: ./scripts/test-go-support.sh
      - name: Check Go support
        run: ./scripts/check-go-support.sh

  verify:
    runs-on: ubuntu-24.04
    container: golang:1.27.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format, build, cross-build, vet, license catalog, race and release tooling tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh scripts/check-go.sh

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build vendored source
        run: go build ./...
      - name: Vet vendored source
        run: go vet ./...
      - name: Test vendored source
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            go test -race ./...
          else
            go test -v ./...
          fi
      - name: Test release tooling
        run: go test scripts/release.go scripts/release_test.go
      - name: Build and smoke test native binary
        run: |
          binary=seestar-copy-cli
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary+=.exe
          fi
          go build -o "$binary" ./cmd/seestar-copy-cli
          "./$binary" --version
          "./$binary" sync --help

  window:
    # The app's window on each OS's own webview. macOS and Linux need cgo, so
    # only these runners build it; check-go.sh cross-builds Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev bubblewrap xvfb xauth dbus-x11
          # Ubuntu restricts the unprivileged user namespaces WebKit's
          # sandbox needs; lift that for this job.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and vet the window
        run: |
          ext=''; ldflags=''
          if [[ "$RUNNER_OS" == Windows ]]; then
            export CGO_ENABLED=0
            ext=.exe; ldflags='-H windowsgui'
          else
            export CGO_ENABLED=1
            if [[ "$RUNNER_OS" == macOS ]]; then
              export CC="$PWD/scripts/gui-mac-clang.sh" MACOSX_DEPLOYMENT_TARGET=13.0
            fi
          fi
          go vet -tags gui,production ./...
          go build -tags gui,production -ldflags="$ldflags" -o "$RUNNER_TEMP/seestar-copy$ext" ./cmd/seestar-copy
          echo "WINDOW_BIN=$RUNNER_TEMP/seestar-copy$ext" >> "$GITHUB_ENV"
      - name: Open the window, load Browse and quit
        run: |
          cat > "$RUNNER_TEMP/window.py" <<'PY'
          import json, os, socket, subprocess, sys
          tmp = os.environ["RUNNER_TEMP"]
          # Browse dials the saved address once the page and its frame have
          # loaded, so a connection here shows the window works end to end.
          device = socket.create_server(("127.0.0.1", 0))
          device.settimeout(120)
          settings = os.path.join(tmp, "app.json")
          with open(settings, "w") as f:
              json.dump({"version": 1, "address": "127.0.0.1:%d" % device.getsockname()[1], "folder": os.path.join(tmp, "images")}, f)
          log = open(os.path.join(tmp, "window.log"), "w")
          app = subprocess.Popen([os.environ["WINDOW_BIN"], "--settings", settings], stdout=log, stderr=log)
          try:
              device.accept()[0].close()
          except TimeoutError:
              app.kill()
              sys.exit("the window never loaded Browse")
          print("Browse loaded in the window")
          # Closing the window (WM_CLOSE on Windows) or SIGTERM quits the app.
          if os.name == "nt":
              subprocess.run(["taskkill", "/PID", str(app.pid)], check=True)
          else:
              app.terminate()
          code = app.wait(timeout=60)
          sys.exit("the app exited %d" % code if code else 0)
          PY
          python=$(command -v python3 || command -v python)
          if [[ "$RUNNER_OS" == Linux ]]; then
            GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' "$python" "$RUNNER_TEMP/window.py"
          else
            "$python" "$RUNNER_TEMP/window.py"
          fi
      - name: App log
        if: failure()
        run: cat "$RUNNER_TEMP/window.log" || true

  smb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Start the Samba fixture
        run: |
          docker build -f internal/remote/testdata/samba/Containerfile -t seestar-copy-samba internal/remote/testdata/samba
          docker run -d --name samba -p 127.0.0.1:14450:14450 seestar-copy-samba
          for try in $(seq 50); do
            if docker exec samba bash -c 'exec 3<>/dev/tcp/127.0.0.1/14450'; then exit 0; fi
            sleep 0.2
          done
          docker logs samba
          exit 1
      - name: SMB integration tests
        env:
          SEESTAR_COPY_SMB_ENDPOINT: 127.0.0.1:14450
        run: go test -tags smbintegration -race -count=1 -timeout 10m -v ./internal/remote
      - name: Samba log
        if: failure()
        run: docker logs samba

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Start the Samba fixture with the browse tree
        run: |
          docker build --target browse -f internal/remote/testdata/samba/Containerfile -t seestar-copy-samba-browse internal/remote/testdata/samba
          docker run -d --name samba -p 127.0.0.1:14450:14450 seestar-copy-samba-browse
          for try in $(seq 50); do
            if docker exec samba bash -c 'exec 3<>/dev/tcp/127.0.0.1/14450'; then exit 0; fi
            sleep 0.2
          done
          docker logs samba
          exit 1
      - name: Start browse
        run: |
          go build -o "$RUNNER_TEMP/seestar-copy-cli" ./cmd/seestar-copy-cli
          "$RUNNER_TEMP/seestar-copy-cli" browse --endpoint 127.0.0.1:14450 --listen 127.0.0.1:0 \
            > "$RUNNER_TEMP/browse.url" 2> "$RUNNER_TEMP/browse.log" &
          for try in $(seq 50); do
            if [ -s "$RUNNER_TEMP/browse.url" ]; then
              echo "BROWSE_URL=$(head -n 1 "$RUNNER_TEMP/browse.url")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/browse.log"
          exit 1
      - name: Build the app
        run: |
          go build -o "$RUNNER_TEMP/seestar-copy" ./cmd/seestar-copy
          echo "APP_BIN=$RUNNER_TEMP/seestar-copy" >> "$GITHUB_ENV"
      - name: Install Playwright and its browsers
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Browser tests
        working-directory: test/browser
        run: npx playwright test
      - name: Upload screenshots
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: test/browser/screenshots
          if-no-files-found: ignore
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            test/browser/playwright-report
            test/browser/test-results
          if-no-files-found: ignore
      - name: browse and Samba logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/browse.log" || true
          docker logs samba

  vendor:
    runs-on: ubuntu-24.04
    container: golang:1.27.3
    env:
      GOFLAGS: ''
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vendor tree is reproducible
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go mod tidy
          go mod vendor
          test -z "$(git status --porcelain -- go.mod go.sum vendor)" || { git status --porcelain -- go.mod go.sum vendor; exit 1; }
